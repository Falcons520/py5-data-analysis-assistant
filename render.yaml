services:
  - type: web
    name: ai-data-analysis-assistant
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: JOB_RETENTION_HOURS
        value: "24"
