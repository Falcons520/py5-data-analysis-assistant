services:
  app:
    build: .
    image: ai-data-analysis-assistant:local
    container_name: analysis-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 或环境变量中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-1}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
